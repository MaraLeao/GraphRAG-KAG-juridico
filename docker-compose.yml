# Neo4j do projeto. Lê NEO4J_PASSWORD do arquivo .env (na mesma pasta).
#
# Primeira vez (restaurar o banco pronto a partir de dump/neo4j.dump):
#   docker compose run --rm restore
#   docker compose up -d neo4j
#
# Dia a dia:   docker compose up -d neo4j   |   docker compose stop
# Apagar tudo: docker compose down -v   (remove o volume com o banco)

x-neo4j-image: &neo4j-image neo4j:2026.10.2   # versão fixa: o dump precisa ser lido pela mesma versão (ou mais nova)

services:
  neo4j:
    image: *neo4j-image
    container_name: neo4j-kag
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt (driver Python)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?defina NEO4J_PASSWORD no .env (mín. 8 caracteres)}
      NEO4J_PLUGINS: '["graph-data-science"]'
      # config de memória (ajustar conforme necessário)
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    restart: unless-stopped

  # Restaura dump/neo4j.dump no volume. Só roda quando chamado explicitamente
  # (docker compose run --rm restore), com o serviço neo4j PARADO.
  restore:
    image: *neo4j-image
    profiles: ["restore"]
    command: neo4j-admin database load neo4j --from-path=/backups --overwrite-destination=true
    volumes:
      - neo4j_data:/data
      - ./dump:/backups:ro

volumes:
  neo4j_data:
  neo4j_plugins:
