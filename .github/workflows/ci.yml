name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1 — Testes unitários (mock)
  # Roda em todo push e PR. Rápido, sem custo.
  # ─────────────────────────────────────────────
  unit-tests:
    name: Testes unitários (mock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Lint com ruff
        run: ruff check src/ tests/

      - name: Rodar testes com mock
        env:
          GRAPHRAG_MOCK: "1"
          NEO4J_URI:      "bolt://localhost:7687"
          NEO4J_USERNAME: "neo4j"
          NEO4J_PASSWORD: "testpassword"
          NEO4J_DATABASE: "neo4j"
          OPENROUTER_KEY: "fake-key"
          FALLBACK_OPENROUTER_KEY: "fake-key"
        run: python -m pytest tests/ -v

  # ─────────────────────────────────────────────
  # Job 2 — Testes de integração (credenciais reais)
  # Roda APENAS quando há merge na main.
  # Depende do Job 1 passar primeiro.
  # ─────────────────────────────────────────────
  integration-tests:
    name: Testes de integração (Neo4j + OpenRouter)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Rodar testes com credenciais reais
        env:
          NEO4J_URI:                ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME:           ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD:           ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE:           ${{ secrets.NEO4J_DATABASE }}
          OPENROUTER_KEY:           ${{ secrets.OPENROUTER_KEY }}
          FALLBACK_OPENROUTER_KEY:  ${{ secrets.FALLBACK_OPENROUTER_KEY }}
        run: python -m pytest tests/ -v -m integration