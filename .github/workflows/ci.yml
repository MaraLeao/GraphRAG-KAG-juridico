name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Um novo push no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Segredos: falha se algum commit do PR (ou do push) trouxer senha, chave ou token,
  # como o .env ou as credenciais do Aura. Licença do gitleaks-action só é exigida em organizações.
  secrets:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # a action lista os commits do PR pela API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo para varrer os commits do PR

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"   # o resultado fica no check e no resumo da execução

  # Lint: rápido e independente das dependências pesadas do projeto.
  # scripts/ (pipeline de ingestão, rodado uma vez) fica de fora.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências (versões do uv.lock)
        run: uv sync --locked

      - name: Rodar ruff
        run: uv run ruff check src/ tests/ app/

  # Testes: rodam sem Neo4j e sem LLM (mocks e execuções gravadas),
  # então não usam segredos nem gastam a cota do OpenRouter.
  tests:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked falha se o uv.lock estiver desatualizado em relação ao pyproject.toml.
      # Sem o extra "embeddings": os testes não carregam o sentence-transformers (nem o PyTorch).
      - name: Instalar dependências (versões do uv.lock)
        run: uv sync --locked

      - name: Rodar testes
        env:
          GRAPHRAG_MOCK: "1"
        run: uv run pytest -v