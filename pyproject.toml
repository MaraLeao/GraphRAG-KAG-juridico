[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-juridico"
version = "0.1.0"
description = "GraphRAG/KAG sobre artigos jurídicos com Neo4j e LLMs"
requires-python = ">=3.11"
# As dependências ficam em requirements.txt (instale com: uv pip install -r requirements.txt)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
